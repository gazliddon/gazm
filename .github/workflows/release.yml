# Release: build gazm binaries for Windows / macOS / Linux.
#
# This workflow is deliberately NON-publishing by default: it builds all four
# targets and stores the archives as run artifacts, but does NOT create a
# GitHub release or upload anything to it. Publish manually:
#
#   gh release create v0.9.17 --notes "crates@<sha>"
#   gh release upload v0.9.17 <downloaded archives>
#
# Triggered either by a v* tag push (the real release build) or manually from
# the Actions tab (workflow_dispatch) to preview the build without tagging.
#
# (See docs/RELEASING.md for the full loop. To make tags auto-publish later,
# set dry_run to false and add permissions: contents: write.)

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview version label (e.g. 0.9.17-preview); tag name is used when triggered by a tag'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: gazm

      # gazm/Cargo.toml resolves its crates via ../../crates from the crate
      # dir (repo/gazm), i.e. $GITHUB_WORKSPACE/crates with the repo at
      # path: gazm. checkout@v4 refuses paths outside the workspace, so use
      # a plain relative name; pin to crates@main and record the SHA so the
      # release is reproducible.
      - uses: actions/checkout@v4
        with:
          repository: gazliddon/crates
          path: crates

      - name: Record crates SHA
        id: crates-sha
        run: echo "sha=$(git -C crates rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Stargate is the byte-identity fixture the ROM checksums were verified
      # against; record its revision so the release notes state exactly which
      # fixture the binaries correspond to.
      - uses: actions/checkout@v4
        with:
          repository: gazliddon/stargate
          path: stargate

      - name: Record stargate SHA
        id: stargate-sha
        run: echo "sha=$(git -C stargate rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and compress binaries (no upload)
        id: build
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: gazm
          target: ${{ matrix.target }}
          manifest-path: gazm/Cargo.toml
          tar: unix
          zip: windows
          checksum: sha256
          dry_run: true

      - name: Upload archives as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gazm-${{ matrix.target }}
          path: |
            ${{ steps.build.outputs.tar }}
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.sha256 }}
          if-no-files-found: error

      # One job writes the build manifest (identical SHAs on every job);
      # scripts/release.sh reads it to compose the release notes.
      - name: Write build manifest
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          {
            echo "gazm=${{ github.sha }}"
            echo "crates=${{ steps.crates-sha.outputs.sha }}"
            echo "stargate=${{ steps.stargate-sha.outputs.sha }}"
          } > build-manifest.txt

      - name: Upload build manifest
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: build-manifest
          path: build-manifest.txt
          if-no-files-found: error

      # The Linux job also writes the full release-notes markdown (same SHAs
      # on every job) so scripts/release.sh --publish can use it verbatim as
      # the GitHub release body.
      - name: Write release notes
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RELEASE="${{ github.event.inputs.version }}"
          else
            RELEASE="${GITHUB_REF_NAME}"
          fi
          {
            echo "# gazm ${RELEASE}"
            echo ""
            echo "Assembler binaries for Linux, Windows, and macOS (Apple Silicon)."
            echo ""
            echo "## Source revisions"
            echo ""
            echo "- gazm@\`${{ github.sha }}\`"
            echo "- crates@\`${{ steps.crates-sha.outputs.sha }}\`"
            echo "- stargate@\`${{ steps.stargate-sha.outputs.sha }}\` (ROM fixture)"
            echo ""
            echo "## What to download"
            echo ""
            echo "- \`gazm-x86_64-unknown-linux-gnu\` — Linux (tar.gz + sha256)"
            echo "- \`gazm-x86_64-pc-windows-msvc\` — Windows (zip + sha256)"
            echo "- \`gazm-aarch64-apple-darwin\` — macOS Apple Silicon (tar.gz + sha256)"
            echo ""
            echo "Pick the archive for your platform, unpack it, and put the"
            echo "\`gazm\` binary somewhere on your \`PATH\` (or note its full path)."
            echo ""
            echo "## How to verify this release"
            echo ""
            echo "Gazm's primary compatibility gate is assembling the Stargate"
            echo "fixture and checking the generated ROMs byte-for-byte against the"
            echo "originals (via the committed SHA-1 manifest). To reproduce it:"
            echo ""
            echo '```sh'
            echo "# 1. Get the exact Stargate source this release was verified against"
            echo "git clone https://github.com/gazliddon/stargate.git"
            echo "cd stargate"
            echo "git checkout ${{ steps.stargate-sha.outputs.sha }}"
            echo ""
            echo "# 2. Run the gazm binary you downloaded, from the stargate directory"
            echo "#    (replace /path/to/gazm with your unpacked binary)"
            echo "/path/to/gazm build"
            echo ""
            echo "# 3. Every ROM must match the committed checksums:"
            echo "sha1sum -c roms.sha1"
            echo '```'
            echo ""
            echo "All 13 files must report \`OK\`. If any reports \`FAILED\`, the"
            echo "binary is not producing the expected ROM output — don't use it."
            echo ""
            echo "> The \`roms.sha1\` manifest lives in the stargate repo at the"
            echo "> revision above, so \`git checkout\` gives you the exact expected"
            echo "> hashes. \`crates@\` is listed for reproducibility of the build"
            echo "> itself; end users only need the binary + stargate."
          } > RELEASE_NOTES.md

      - name: Upload release notes
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

      - name: Publish instructions for this target
        # Windows runners default to PowerShell for `run:` steps; force bash
        # so the heredoc works on all four platforms.
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RELEASE="${{ github.event.inputs.version }}"
            TRIGGER="manual preview (no tag created)"
          else
            RELEASE="${GITHUB_REF_NAME}"
            TRIGGER="tag ${GITHUB_REF_NAME}"
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## gazm-${{ matrix.target }}

          Built from ${{ github.sha }} (${TRIGGER}) against:

          - crates@\`${{ steps.crates-sha.outputs.sha }}\`
          - stargate@\`${{ steps.stargate-sha.outputs.sha }}\` (ROM fixture)

          Download the **gazm-${{ matrix.target }}** artifact from this run,
          then attach it to the release:

          \`\`\`sh
          gh release upload ${RELEASE} <downloaded-archives>
          \`\`\`
          EOF
