[package]
name = "gazm"
version = "0.10.0"
edition = "2021"
authors= ["Gaz Liddon"]

[dependencies]
anyhow="1.0.104"
ariadne = "0.6"
clap = { version = "4.6.6", features = ["derive", "color", "cargo"] }
colored = "2.2.0"
ego-tree="0.11.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-chrome = { version = "0.7.2", optional = true }
rayon = "1.12.0"

serde = { version="1.0.229", features=[ "derive" ]}
serde_json = "1.0.151"
bincode = "1.3"
serde_yaml = "0.9.25"

thin-vec="0.2.19"
thiserror="1.0.69"
toml="0.8.23"
logos="0.16.1"

emu6809 = {path="../../crates/emu6809"}
emu6800 = {path="../../crates/emu6800"}
grl-sources = {path = "../../crates/grl-sources", features = ["serde"]}
grl-utils = {path = "../../crates/grl-utils"}
grl-symbols = {path = "../../crates/grl-symbols", features = ["serde"]}
grl-eval = {path="../../crates/grl-eval"}
unraveler = {path="../../crates/unraveler"}

num-traits = "0.2.19"
strum = { version = "0.26.3" }
strum_macros = { version = "0.26.4" }
regex = "1.13.1"
termimad = "0.25.5"
glob = "0.3.4"
convert_case = "0.6.0"

[features]
default = []
chrome-trace = ["dep:tracing-chrome"]

[dev-dependencies]
pretty_assertions="1.4.0"
criterion = "0.5.1"
gazm-metadata = { path = "../gazm-metadata" }

[[bench]]
name = "pipeline"
harness = false

[build-dependencies]
glob = "0.3.1"
makehelp ={path="../makehelp"} 
anyhow="1.0.104"
