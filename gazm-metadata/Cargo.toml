[package]
name = "gazm-metadata"
version = "0.1.0"
edition = "2021"
description = "Reader library for gazm .map/.sym artifacts (source maps + symbols)"
license = "MIT"

[dependencies]
bincode = "1.3"
rmp-serde = "1"
serde = { version = "1.0", features = ["derive"] }

grl-sources = { path = "../../crates/grl-sources", features = ["serde"] }
grl-symbols = { path = "../../crates/grl-symbols", features = ["serde"] }

